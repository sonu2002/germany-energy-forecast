# Every morning: download the newest SMARD data, re-run the backtest and publish tomorrow's forecast.
name: Daily forecast
on:
  schedule:
    - cron: "40 5 * * *"     # 05:40 UTC ≈ 06:40/07:40 Berlin
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: daily-forecast, cancel-in-progress: false }
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python src/download.py
      - run: python src/pipeline.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs/data
          git diff --cached --quiet || (git commit -m "Daily forecast: $(date -u +%F)" && git push)
